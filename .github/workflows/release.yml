name: Release Cascade

on:
  push:
    branches:
      - main
    paths:
      - "packages/core/package.json"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      trygg_version: ${{ steps.detect.outputs.trygg_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect trygg version bump
        id: detect
        run: bun ./scripts/release/cli.ts detect-trygg-bump --branch "${{ github.ref_name }}" --before-sha "${{ github.event.before || '' }}"

  check:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

  publish-trygg:
    needs:
      - prepare
      - check
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish trygg
        id: publish
        run: bun ./scripts/release/cli.ts publish-package --package trygg --package-version "${{ needs.prepare.outputs.trygg_version }}" --cwd packages/core

      - name: Push trygg tag
        if: steps.publish.outputs.published == 'true'
        run: bun ./scripts/release/cli.ts push-tag --tag "trygg@${{ needs.prepare.outputs.trygg_version }}" --target "${{ github.sha }}" --message "trygg v${{ needs.prepare.outputs.trygg_version }}"

      - name: Create trygg release
        if: steps.publish.outputs.published == 'true'
        uses: actions/github-script@v8
        env:
          TRYGG_VERSION: ${{ needs.prepare.outputs.trygg_version }}
        with:
          script: |
            const tagName = `trygg@${process.env.TRYGG_VERSION}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `trygg v${process.env.TRYGG_VERSION}`,
                draft: false,
                prerelease: process.env.TRYGG_VERSION.includes('-'),
                generate_release_notes: true,
              });
            }

  sync:
    needs:
      - prepare
      - publish-trygg
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      cli_version: ${{ steps.sync.outputs.cli_version }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync create-trygg release files
        id: sync
        run: bun ./scripts/release/cli.ts sync

      - name: Refresh lockfile
        run: bun install

      - name: Commit release sync
        id: commit
        run: bun ./scripts/release/cli.ts commit-sync --branch "${{ github.ref_name }}" --trygg-version "${{ needs.prepare.outputs.trygg_version }}"

  publish-create-trygg:
    needs:
      - prepare
      - sync
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.sync.outputs.commit_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Wait for trygg on npm
        run: bun ./scripts/release/cli.ts wait-for-npm --package trygg --package-version "${{ needs.prepare.outputs.trygg_version }}"

      - name: Publish create-trygg
        id: publish
        run: bun ./scripts/release/cli.ts publish-package --package create-trygg --package-version "${{ needs.sync.outputs.cli_version }}" --cwd packages/cli

      - name: Push create-trygg tag
        if: steps.publish.outputs.published == 'true'
        run: bun ./scripts/release/cli.ts push-tag --tag "create-trygg@${{ needs.sync.outputs.cli_version }}" --target "${{ needs.sync.outputs.commit_sha }}" --message "create-trygg v${{ needs.sync.outputs.cli_version }}"

      - name: Create create-trygg release
        if: steps.publish.outputs.published == 'true'
        uses: actions/github-script@v8
        env:
          CLI_VERSION: ${{ needs.sync.outputs.cli_version }}
        with:
          script: |
            const tagName = `create-trygg@${process.env.CLI_VERSION}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `create-trygg v${process.env.CLI_VERSION}`,
                draft: false,
                prerelease: process.env.CLI_VERSION.includes('-'),
                generate_release_notes: true,
              });
            }
