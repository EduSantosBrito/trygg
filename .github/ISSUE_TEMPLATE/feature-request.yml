name: Feature request
description: Propose a new user-facing capability or behavior.
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or opportunity does this address?
      placeholder: Describe the current limitation or missing capability.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be possible when this exists?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: What must remain true? What is intentionally out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete checks that prove this is done.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Examples, prior art, screenshots, links, or related issues.
    validations:
      required: false
