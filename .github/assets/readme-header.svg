<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="trygg — Type-safe UI, from the ground up">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap');
    ]]></style>
  </defs>

  <!-- Paper-warm canvas (matches site + OG card) -->
  <rect width="1200" height="300" fill="#f7f4ed" />

  <!-- Brand lockup: pixel-ladder mark + wordmark, top-left -->
  <g transform="translate(80, 72)">
    <g transform="scale(1.3)" fill="#892122">
      <rect y="37" width="7" height="7" />
      <rect opacity=".6" x="7" y="37" width="7" height="7" />
      <rect opacity=".32" x="14" y="37" width="7" height="7" />
      <rect opacity=".07" x="21" y="37" width="7" height="7" />
      <rect opacity=".6" y="30" width="7" height="7" />
      <rect opacity=".32" x="7" y="30" width="7" height="7" />
      <rect opacity=".07" x="7" y="23" width="7" height="7" />
      <rect opacity=".07" x="14" y="30" width="7" height="7" />
      <rect opacity=".32" y="23" width="7" height="7" />
      <rect opacity=".07" y="16" width="7" height="7" />
      <rect x="33" y="4" width="7" height="7" />
      <rect opacity=".6" x="33" y="11" width="7" height="7" />
      <rect opacity=".32" x="26" y="11" width="7" height="7" />
      <rect opacity=".07" x="19" y="11" width="7" height="7" />
      <rect opacity=".32" x="33" y="18" width="7" height="7" />
      <rect opacity=".07" x="26" y="18" width="7" height="7" />
      <rect opacity=".07" x="33" y="25" width="7" height="7" />
      <rect opacity=".6" x="26" y="4" width="7" height="7" />
      <rect opacity=".32" x="19" y="4" width="7" height="7" />
      <rect opacity=".07" x="12" y="4" width="7" height="7" />
    </g>
    <text
      x="76"
      y="48"
      font-family="'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif"
      font-weight="700"
      font-size="42"
      fill="#231e17"
      letter-spacing="-0.015em"
    >trygg</text>
  </g>

  <!-- Kicker, top-right: oxblood pull-mark + mono label (matches OG card) -->
  <g transform="translate(990, 120)">
    <rect x="0" y="-6" width="24" height="2" fill="#a83a2c" />
    <text
      x="36"
      y="0"
      font-family="'IBM Plex Mono', ui-monospace, monospace"
      font-weight="500"
      font-size="14"
      fill="#5d564a"
      letter-spacing="0.14em"
    >TRYGG.DEV</text>
  </g>

  <!-- Statement: two-line, ink + oxblood punchline (OG two-tone device) -->
  <text
    font-family="'IBM Plex Sans', system-ui, sans-serif"
    font-weight="600"
    font-size="44"
    letter-spacing="-0.025em"
  >
    <tspan x="80" y="200" fill="#231e17">Type-safe UI.</tspan>
    <tspan x="80" y="252" fill="#a83a2c">From the ground up.</tspan>
  </text>
</svg>
